[project]
name = "flywiresim"
version = "0.1.0"
description = "FlyWire whole-brain model base for a 3D bat and moth simulation"
requires-python = ">=3.11"
dependencies = [
  "brian2>=2.9,<3",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "mujoco>=3.3.7,<4",
  "numpy<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "stable-baselines3>=2.6,<3",
]

[project.scripts]
flywiresim = "flywiresim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flywiresim"]
